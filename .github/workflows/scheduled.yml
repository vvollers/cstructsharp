name: Scheduled checks

# The repository's recurring runs, in one place.
# - Weekly (Sunday 03:11 UTC): the managed, web and documentation workflows in full, whatever their path filters
#   would select, so an effect that a filter did not anticipate still shows up; and the vulnerability check of the
#   locked dependencies.
# - Monthly (first day, 05:23 UTC): the external-link check of the documentation. It depends on third-party sites,
#   so it stays out of the pull-request gate.
# The complete mutation run (mutation.yml) has no schedule; it is started by hand. Each reused workflow can also be started
# on its own from its workflow page; starting this workflow by hand runs the selected set.
on:
  schedule:
    - cron: "11 3 * * 0"
    - cron: "23 5 1 * *"
  workflow_dispatch:
    inputs:
      checks:
        description: Which scheduled set to run
        required: true
        default: weekly
        type: choice
        options: [weekly, external-links]

permissions:
  contents: read

jobs:
  managed:
    name: Managed verification
    if: github.event.schedule == '11 3 * * 0' || inputs.checks == 'weekly'
    uses: ./.github/workflows/ci.yml

  web:
    name: Web verification
    if: github.event.schedule == '11 3 * * 0' || inputs.checks == 'weekly'
    uses: ./.github/workflows/web.yml

  documentation:
    name: Documentation verification
    if: github.event.schedule == '11 3 * * 0' || inputs.checks == 'weekly'
    uses: ./.github/workflows/docs.yml

  dependencies:
    name: Dependency check
    if: github.event.schedule == '11 3 * * 0' || inputs.checks == 'weekly'
    uses: ./.github/workflows/dependency-check.yml

  external-links:
    name: External documentation links
    if: github.event.schedule == '23 5 1 * *' || inputs.checks == 'external-links'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Reviewed exceptions live in contracts/documentation/external-link-allowlist.json; a failure names each link.
      - name: Check every external link in the documentation sources
        run: node tools/documentation/test-documentation-external-links.mjs
