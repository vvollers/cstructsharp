name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and package documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install browser system dependencies
        working-directory: docs
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          npm ci --ignore-scripts
          npm exec -- playwright install-deps chromium

      - name: Run the complete documentation gate
        shell: pwsh
        run: ./tools/documentation/Validate-Documentation.ps1

      - name: Upload documentation review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cstructsharp-documentation-${{ github.sha }}
          path: |
            docs/_site/
            docs/docfx-build.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
