name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
      - "CStructSharp/**"
      - "CStructSharp.Docs/**"
      - "CStructSharpTests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "tools/Build-Documentation.ps1"
      - "tools/New-DocumentationPagesArtifact.ps1"
      - "tools/Test-DocumentationExternalLinks.ps1"
      - "tools/Test-DocumentationSourceSnapshot.ps1"
      - "tools/Validate-ApiDocumentation.ps1"
      - "tools/Validate-CanonicalReference.ps1"
      - "tools/Validate-Documentation.ps1"
      - "tools/Validate-DocumentationQuality.ps1"
      - "tools/Validate-DocumentationWorkflow.ps1"
      - "tools/Validate-FeatureOperationMatrix.ps1"
      - "tools/Validate-LanguageDocumentation.ps1"
      - "tools/Validate-PagesArtifact.ps1"
  pull_request:
    paths:
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
      - "CStructSharp/**"
      - "CStructSharp.Docs/**"
      - "CStructSharpTests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "tools/Build-Documentation.ps1"
      - "tools/New-DocumentationPagesArtifact.ps1"
      - "tools/Test-DocumentationExternalLinks.ps1"
      - "tools/Test-DocumentationSourceSnapshot.ps1"
      - "tools/Validate-ApiDocumentation.ps1"
      - "tools/Validate-CanonicalReference.ps1"
      - "tools/Validate-Documentation.ps1"
      - "tools/Validate-DocumentationQuality.ps1"
      - "tools/Validate-DocumentationWorkflow.ps1"
      - "tools/Validate-FeatureOperationMatrix.ps1"
      - "tools/Validate-LanguageDocumentation.ps1"
      - "tools/Validate-PagesArtifact.ps1"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated artifact to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and package documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: CStructSharp.Docs/package-lock.json

      - name: Install browser system dependencies
        working-directory: CStructSharp.Docs
        run: |
          npm ci --ignore-scripts
          npm exec -- playwright install-deps chromium

      - name: Run the complete documentation gate
        shell: pwsh
        run: ./tools/Validate-Documentation.ps1

      - name: Upload documentation review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cstructsharp-documentation-${{ github.sha }}
          path: |
            CStructSharp.Docs/_site/
            CStructSharp.Docs/docfx-build.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload validated GitHub Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: CStructSharp.Docs/_site

  deploy:
    name: Deploy validated documentation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
