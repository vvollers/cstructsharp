name: Web

# The browser side of the repository: the WASM bridge, the npm package, and the explorer and inspector apps.
# `checks` runs the fast lint and unit checks without .NET; `browser` builds the WASM publication once and runs every
# check that needs it; `node` installs the packed npm package on each supported Node version and platform.
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "src/CStructSharp/**"
      - "src/CStructSharp.Core/**"
      - "src/CStructSharp.Generators/**"
      - "src/CStructSharp.Wasm/**"
      - "packages/**"
      - "apps/**"
      - "tools/**"
      - "contracts/**"
      - "tests/CStructSharpTests/**"
      - "package.json"
      - "global.json"
      - ".node-version"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "src/CStructSharp/**"
      - "src/CStructSharp.Core/**"
      - "src/CStructSharp.Generators/**"
      - "src/CStructSharp.Wasm/**"
      - "packages/**"
      - "apps/**"
      - "tools/**"
      - "contracts/**"
      - "tests/CStructSharpTests/**"
      - "package.json"
      - "global.json"
      - ".node-version"
      - ".github/workflows/web.yml"
  schedule:
    # A weekly full run catches an effect on the web side that the path filter did not anticipate.
    - cron: "11 4 * * 0"
  workflow_dispatch:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint and unit-test the apps, the bridge, and the tools
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the npm workspace (the apps and the package)
        run: npm ci

      - name: Check changed script documentation
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test tools/quality/script-documentation.spec.mjs
          if [ -z "$DIFF_BASE" ] || [ "$DIFF_BASE" = "0000000000000000000000000000000000000000" ]; then DIFF_BASE=$(git rev-parse HEAD^); fi
          node tools/quality/changed-documentation.mjs --base "$DIFF_BASE" --language script

      - name: Lint tools and the WASM bridge
        run: node node_modules/eslint/bin/eslint.js --config tools/eslint.config.mjs "tools/**/*.mjs" "packages/cstructsharp/src/**/*.js" "packages/cstructsharp/tests/**/*.mjs" --max-warnings 0

      - name: Apps lint, format, and unit tests (every workspace)
        run: |
          npm run lint
          npm run format:check
          npm run test:unit

      - name: WASM bridge interop and publication manifest tests
        run: |
          npm run test:bootstrap
          npm run test:wasm-publication

  browser:
    name: Build the WASM publication once and test everything that uses it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: dotnet workload restore src/CStructSharp.Wasm/CStructSharpWeb.Wasm.csproj
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/explorer
      # The package scripts live in the repository root; the browser and TypeScript consumer checks resolve
      # Vite, Playwright, and tsc from the workspace's pinned dependencies installed above.
      - name: Build once and test the actual tarball
        run: |
          npm run build:wasm
          npm run pack:npm
          npm run test:npm
          npm run test:npm-release
      - name: Explorer build, catalog, and browser tests
        working-directory: apps/explorer
        run: |
          npm run copy:wasm
          npm run build:frontend
          npm run test:demos
          npm run test:e2e
          npm run test:generated-csharp
          npm run --prefix ../.. test:wasm-reproducibility
      - name: Inspector build and browser tests against the same WASM
        working-directory: apps/inspector
        run: |
          npm run build
          npm run test:e2e
      - name: Standalone WASM onboarding and package browser tests (starter pages, bridge contract)
        run: |
          node tools/packaging/create-wasm-package.mjs
          (cd artifacts/wasm-package && zip -qr ../wasm-onboarding.zip .)
          node tools/packaging/test-onboarding-browser.mjs --archive-path artifacts/wasm-onboarding.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: |
            artifacts/npm/*.tgz
            artifacts/npm/package-info.json
          if-no-files-found: error

  node:
    name: npm package on Node ${{ matrix.node }} (${{ matrix.os }})
    needs: browser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.14.0, 24.0.0, 26.5.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts/npm
      - run: npm run test:npm:node
