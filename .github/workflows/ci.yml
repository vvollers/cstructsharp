name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Verify .sln project-list parity
        shell: pwsh
        run: ./tools/Validate-SolutionParity.ps1

      - name: Restore dependencies
        run: dotnet restore ./CStructSharp.NonWeb.sln

      - name: Build
        run: dotnet build ./CStructSharp.NonWeb.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test ./CStructSharpTests/CStructSharpTests.csproj
          -c Release
          --no-build
          --logger trx
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
