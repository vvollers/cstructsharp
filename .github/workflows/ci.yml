name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Verify .sln project-list parity
        shell: pwsh
        run: ./tools/quality/Validate-SolutionParity.ps1

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Verify managed API baseline
        shell: pwsh
        env:
          # PublicApiGenerator.Tool targets net6.0; the runner only has 8.x/9.x/10.x shared runtimes installed.
          DOTNET_ROLL_FORWARD: LatestMajor
        run: ./tools/quality/Compare-ManagedApiBaseline.ps1

      - name: Restore dependencies
        run: dotnet restore ./CStructSharp.NonWeb.sln

      - name: Build
        run: dotnet build ./CStructSharp.NonWeb.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test ./tests/CStructSharpTests/CStructSharpTests.csproj
          -c Release
          --no-build
          --logger trx
          --results-directory ./artifacts/test-results

      - name: Set up Node for documentation recipe export
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - name: Verify quality contracts
        shell: pwsh
        run: |
          ./tools/quality/Validate-BrowserContract.ps1
          ./tools/quality/Validate-FuzzCorpus.ps1
          ./tools/quality/Validate-CompilerFixture.ps1
          ./tools/quality/Validate-NonWebReleaseBudgets.ps1 -SelfTest
      - name: Pack and verify actual NuGet consumers
        shell: pwsh
        run: |
          dotnet pack src/CStructSharp/CStructSharp.csproj -c Release -o artifacts/package
          $package = Get-ChildItem artifacts/package/*.nupkg | Select-Object -First 1
          $symbols = Get-ChildItem artifacts/package/*.snupkg | Select-Object -First 1
          ./tools/packaging/Validate-Package.ps1 -PackagePath $package.FullName -SymbolPackagePath $symbols.FullName
          ./tools/packaging/Test-PackageConsumer.ps1 -PackageDirectory artifacts/package
          ./tools/packaging/Test-OnboardingPackage.ps1 -PackageDirectory artifacts/package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
