name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build, test, and verify release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      # Nothing below this step may run against an untested build: this is the release's test gate.
      - name: Run managed test suite
        run: dotnet test ./CStructSharpTests/CStructSharpTests.csproj -c Release

      - name: Set up Node.js for documentation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: CStructSharp.Docs/package-lock.json

      # Computes the next version and writes it into the working tree so every build/pack step below embeds the
      # correct version, without committing or tagging anything yet. Nothing here mutates shared/remote state.
      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const bump = process.env.BUMP;
          const projectPath = 'CStructSharp/CStructSharp.csproj';
          const project = fs.readFileSync(projectPath, 'utf8');
          const current = project.match(/<VersionPrefix>(\d+)\.(\d+)\.(\d+)<\/VersionPrefix>/);
          if (!current) throw new Error('VersionPrefix was not found.');
          const parts = current.slice(1).map(Number);
          const index = { major: 0, minor: 1, patch: 2 }[bump];
          if (index === undefined) throw new Error(`Unsupported bump: ${bump}`);
          parts[index] += 1;
          for (let i = index + 1; i < parts.length; i += 1) parts[i] = 0;
          const version = parts.join('.');
          const updatedProject = project
            .replace(/<VersionPrefix>[^<]+<\/VersionPrefix>/, `<VersionPrefix>${version}</VersionPrefix>`)
            .replace(/\s*<VersionSuffix>[^<]+<\/VersionSuffix>/, '');
          fs.writeFileSync(projectPath, updatedProject);
          for (const dir of ['CStructSharpWeb', 'CStructSharpInspector']) {
            const packagePath = `${dir}/package.json`;
            const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
            packageJson.version = version;
            fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
            const lockPath = `${dir}/package-lock.json`;
            const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
            lock.version = version;
            if (lock.packages?.['']) lock.packages[''].version = version;
            fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

      # Fails fast, before any expensive build work, if a previous run already published this tag (e.g. a prior
      # release run partially completed). Re-checked in the publish job immediately before tagging.
      - name: Reject a version/tag that already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin. A previous release run may have partially completed; investigate before re-running." >&2
            exit 1
          fi
          echo "Tag ${TAG} does not exist on origin yet; continuing."

      - name: Install documentation dependencies
        working-directory: CStructSharp.Docs
        run: npm ci --ignore-scripts

      - name: Build documentation
        shell: pwsh
        run: ./tools/Build-Documentation.ps1

      - name: Install WebAssembly workload
        run: dotnet workload restore ./CStructSharpWeb/wasm/CStructSharpWeb.Wasm.csproj

      - name: Install explorer dependencies
        working-directory: CStructSharpWeb
        run: npm ci

      - name: Pack NuGet package for all target frameworks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack ./CStructSharp/CStructSharp.csproj -c Release -o ./artifacts/package -p:Version=${VERSION}

      - name: Verify onboarding against the NuGet artifact
        shell: pwsh
        run: ./tools/Test-OnboardingPackage.ps1 -PackageDirectory ./artifacts/package

      - name: Build WebAssembly explorer
        working-directory: CStructSharpWeb
        run: npm run build

      # The inspector shares the explorer's already-built, already-validated WASM bundle (see
      # CStructSharpInspector/scripts/copy-wasm.mjs) instead of publishing its own, so it must build after
      # CStructSharpWeb/public/wasm exists.
      - name: Install inspector dependencies
        working-directory: CStructSharpInspector
        run: npm ci

      - name: Build binary inspector
        working-directory: CStructSharpInspector
        run: npm run build

      - name: Create standalone WASM bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node CStructSharpWeb/scripts/create-wasm-package.mjs
          (cd CStructSharpWeb/artifacts/wasm-package && zip -r "../../../artifacts/cstructsharp-wasm-v${VERSION}.zip" .)

      - name: Install browser for onboarding checks
        working-directory: CStructSharpWeb
        run: npx playwright install --with-deps chromium

      - name: Verify explorer lessons
        working-directory: CStructSharpWeb
        run: |
          npm run test:unit
          npm run test:e2e

      # Reuses the Chromium build (and system dependencies) the previous step already installed - same
      # pinned @playwright/test version as CStructSharpWeb, so no separate browser install is needed.
      - name: Verify binary inspector
        working-directory: CStructSharpInspector
        run: |
          npm run test:unit
          npm run test:e2e

      - name: Verify onboarding against the WASM archive
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/Test-OnboardingBrowser.ps1 -ArchivePath "./artifacts/cstructsharp-wasm-v$env:VERSION.zip"

      - name: Assemble GitHub Pages site
        run: |
          rm -rf artifacts/pages
          mkdir -p artifacts/pages/docs artifacts/pages/explorer artifacts/pages/inspector
          cp -R CStructSharp.Docs/_site/. artifacts/pages/docs/
          cp -R CStructSharpWeb/dist/. artifacts/pages/explorer/
          cp -R CStructSharpInspector/dist/. artifacts/pages/inspector/
          cp CStructSharp.Docs/landing/index.html artifacts/pages/index.html
          touch artifacts/pages/.nojekyll

      # The files below are handed to the publish job so it commits the *exact* version already built and
      # verified above, rather than recomputing (and potentially diverging from) the version bump.
      - name: Upload version-bump files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: version-bump-files
          path: |
            CStructSharp/CStructSharp.csproj
            CStructSharpWeb/package.json
            CStructSharpWeb/package-lock.json
            CStructSharpInspector/package.json
            CStructSharpInspector/package-lock.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-package
          path: artifacts/package
          retention-days: 1
          if-no-files-found: error

      - name: Upload standalone WASM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-bundle
          path: artifacts/cstructsharp-wasm-v*.zip
          retention-days: 1
          if-no-files-found: error

      - name: Upload GitHub Pages site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-site
          path: artifacts/pages
          retention-days: 1
          if-no-files-found: error

  # Nothing in this job runs unless every build/test/verification step in `verify` succeeded. This job is the
  # only one with write access to the repository, NuGet, and GitHub Pages.
  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      # Re-checked here (not just in `verify`) as a last-moment guard against a concurrent or re-triggered run.
      - name: Reject a version/tag that already exists
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin. A previous release run may have partially completed; investigate before re-running." >&2
            exit 1
          fi

      - name: Download version-bump files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-bump-files
          path: .

      - name: Commit and tag version bump
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CStructSharp/CStructSharp.csproj CStructSharpWeb/package.json CStructSharpWeb/package-lock.json CStructSharpInspector/package.json CStructSharpInspector/package-lock.json
          git commit -m "chore: release ${VERSION}"
          git push origin HEAD:main
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "${TAG}"

      - name: Download NuGet package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts/package

      - name: Download standalone WASM bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-bundle
          path: artifacts

      - name: Download GitHub Pages site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: artifacts/pages

      - name: NuGet login through Trusted Publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet package and symbols
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/package/CStructSharp.${VERSION}.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json
          dotnet nuget push "artifacts/package/CStructSharp.${VERSION}.snupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            artifacts/package/*.nupkg \
            artifacts/package/*.snupkg \
            "artifacts/cstructsharp-wasm-v${VERSION}.zip" \
            --title "CStructSharp ${VERSION}" \
            --generate-notes
