name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release normally, prepare the first npm artifact, or recover a verified run
        required: true
        default: release
        type: choice
        options: [release, prepare, recover]
      recovery_run_id:
        description: Original Actions run ID (required only for recover)
        required: false
        type: string
      bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs
        env:
          MODE: ${{ inputs.mode }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main'; exit 1; }
          if [ "$MODE" = recover ]; then
            [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Recovery requires the original numeric run ID'; exit 1; }
          elif [ -n "$RECOVERY_RUN_ID" ]; then
            echo 'Only recover mode accepts a recovery run ID'; exit 1
          fi

  verify:
    needs: validate
    if: inputs.mode != 'recover' && github.ref == 'refs/heads/main'
    name: Build, test, and verify release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      # Nothing below this step may run against an untested build: this is the release's test gate.
      - name: Run managed test suite
        run: dotnet test ./tests/CStructSharpTests/CStructSharpTests.csproj -c Release

      - name: Set up Node.js for documentation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Computes the next version and writes it into the working tree so every build/pack step below embeds the
      # correct version, without committing or tagging anything yet. Nothing here mutates shared/remote state.
      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const bump = process.env.BUMP;
          const projectPath = 'src/CStructSharp/CStructSharp.csproj';
          const project = fs.readFileSync(projectPath, 'utf8');
          const current = project.match(/<VersionPrefix>(\d+)\.(\d+)\.(\d+)<\/VersionPrefix>/);
          if (!current) throw new Error('VersionPrefix was not found.');
          const parts = current.slice(1).map(Number);
          const index = { major: 0, minor: 1, patch: 2 }[bump];
          if (index === undefined) throw new Error(`Unsupported bump: ${bump}`);
          parts[index] += 1;
          for (let i = index + 1; i < parts.length; i += 1) parts[i] = 0;
          const version = parts.join('.');
          const updatedProject = project
            .replace(/<VersionPrefix>[^<]+<\/VersionPrefix>/, `<VersionPrefix>${version}</VersionPrefix>`)
            .replace(/\s*<VersionSuffix>[^<]+<\/VersionSuffix>/, '');
          fs.writeFileSync(projectPath, updatedProject);
          for (const dir of ['apps/workshop', 'apps/inspector', 'packages/cstructsharp']) {
            const packagePath = `${dir}/package.json`;
            const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
            packageJson.version = version;
            fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
            const lockPath = `${dir}/package-lock.json`;
            if (!fs.existsSync(lockPath)) continue;
            const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
            lock.version = version;
            if (lock.packages?.['']) lock.packages[''].version = version;
            fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

      # A normal/prepare run cannot reuse a tag. Recovery validates the original tag and artifacts instead.
      - name: Reject a version/tag that already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin. A previous release run may have partially completed; investigate before re-running." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Unable to check remote tags (exit ${status})." >&2
              exit "$status"
            fi
          fi
          echo "Tag ${TAG} does not exist on origin yet; continuing."

      - name: Install documentation dependencies
        working-directory: docs
        run: npm ci --ignore-scripts

      - name: Build documentation
        shell: pwsh
        run: ./tools/documentation/Build-Documentation.ps1

      - name: Install WebAssembly workload
        run: dotnet workload restore ./src/CStructSharp.Wasm/CStructSharpWeb.Wasm.csproj

      - name: Install explorer dependencies
        working-directory: apps/workshop
        run: npm ci

      - name: Pack NuGet package for all target frameworks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack ./src/CStructSharp/CStructSharp.csproj -c Release -o ./artifacts/package -p:Version=${VERSION}

      - name: Verify NuGet metadata, symbols, and framework selection
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./tools/packaging/Validate-Package.ps1 -PackagePath "artifacts/package/CStructSharp.$env:VERSION.nupkg" -SymbolPackagePath "artifacts/package/CStructSharp.$env:VERSION.snupkg"
          ./tools/packaging/Test-PackageConsumer.ps1 -PackageDirectory artifacts/package

      - name: Verify onboarding against the NuGet artifact
        shell: pwsh
        run: ./tools/packaging/Test-OnboardingPackage.ps1 -PackageDirectory ./artifacts/package

      - name: Build WebAssembly explorer
        working-directory: apps/workshop
        run: npm run build

      # Both independent apps stage the repository-owned validated WASM publication.
      # The workshop's full build above has already populated artifacts/wasm.
      - name: Install inspector dependencies
        working-directory: apps/inspector
        run: npm ci

      - name: Build binary inspector
        working-directory: apps/inspector
        run: npm run build

      - name: Create standalone WASM bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node tools/packaging/create-wasm-package.mjs
          (cd artifacts/wasm-package && zip -r "../cstructsharp-wasm-v${VERSION}.zip" .)

      - name: Install browser for onboarding checks
        working-directory: apps/workshop
        run: npx playwright install --with-deps chromium

      - name: Pack and verify the npm consumer artifact
        working-directory: apps/workshop
        run: |
          npm run pack:npm
          npm run test:npm
          npm run test:bootstrap
          npm run test:wasm-publication
          npm run test:npm-release
          node ../../tools/release/npm-release.mjs --require-missing

      - name: Verify explorer lessons
        working-directory: apps/workshop
        run: |
          npm run test:unit
          npm run test:e2e

      # apps/inspector pins the same @playwright/test range as apps/workshop, but each app's own
      # lockfile can independently drift to a different resolved patch version - and different patches can
      # require a different downloaded browser revision. Install this app's own browser build explicitly
      # rather than assuming the previous step's Chromium download still satisfies it.
      - name: Install browser for inspector checks
        working-directory: apps/inspector
        run: npx playwright install --with-deps chromium

      - name: Verify binary inspector
        working-directory: apps/inspector
        run: |
          npm run test:unit
          npm run test:e2e

      - name: Verify onboarding against the WASM archive
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/packaging/Test-OnboardingBrowser.ps1 -ArchivePath "./artifacts/cstructsharp-wasm-v$env:VERSION.zip"

      - name: Assemble GitHub Pages site
        run: node tools/packaging/assemble-site.mjs

      - name: Record release artifact hashes and source identity
        run: node tools/release/release-artifacts.mjs create

      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: |
            artifacts/npm/*.tgz
            artifacts/npm/package-info.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifest
          path: artifacts/release-manifest.json
          retention-days: 90
          if-no-files-found: error

      # The files below are handed to the publish job so it commits the *exact* version already built and
      # verified above, rather than recomputing (and potentially diverging from) the version bump.
      - name: Upload version-bump files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: version-bump-files
          path: |
            src/CStructSharp/CStructSharp.csproj
            apps/workshop/package.json
            apps/workshop/package-lock.json
            apps/inspector/package.json
            apps/inspector/package-lock.json
            packages/cstructsharp/package.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-package
          path: artifacts/package
          retention-days: 90
          if-no-files-found: error

      - name: Upload standalone WASM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-bundle
          path: artifacts/cstructsharp-wasm-v*.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload GitHub Pages site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-site
          path: artifacts/pages
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  npm-node:
    name: npm on ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.14.0, 24.0.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts/npm
      - name: Test the installed tarball without the SDK or browser
        working-directory: apps/workshop
        run: npm run test:npm:node

  publish:
    name: Publish or recover the verified release
    needs: [validate, verify, npm-node]
    if: >-
      always() && !cancelled() && needs.validate.result == 'success' && github.ref == 'refs/heads/main' &&
      ((inputs.mode == 'release' && needs.verify.result == 'success' && needs.npm-node.result == 'success') ||
       (inputs.mode == 'recover' && inputs.recovery_run_id != ''))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ARTIFACT_RUN_ID: ${{ inputs.mode == 'recover' && inputs.recovery_run_id || github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up publishing Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          registry-url: https://registry.npmjs.org/
      - name: Pin the OIDC-capable npm CLI
        run: npm install --global npm@12.0.2
      - name: Download release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: artifacts
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Read verified source SHA
        id: source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(fs.readFileSync('artifacts/release-manifest.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(manifest.sourceSha)) throw Error('Invalid source SHA');
          if (!/^\d+$/.test(process.env.ARTIFACT_RUN_ID) || manifest.runId !== process.env.ARTIFACT_RUN_ID) throw Error('Invalid original run');
          const run = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${manifest.runId}`], {encoding:'utf8'}));
          if (run.head_sha !== manifest.sourceSha || run.head_branch !== 'main' || run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/release.yml') throw Error('Artifacts must originate from the main-branch Release workflow');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${manifest.sourceSha}\n`);
          NODE
      - name: Check out the exact original source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          clean: false
          fetch-depth: 0
      - name: Download version files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-bump-files
          path: .
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts/npm
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts/package
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download standalone WASM bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-bundle
          path: artifacts
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download Pages site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: artifacts/pages
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify original run, test gates, versions and every artifact hash
        id: release
        run: node tools/release/release-artifacts.mjs verify
      - name: Check npm identity before any publication
        id: npm
        run: node tools/release/npm-release.mjs
      - name: Commit and tag the exact verified version, or verify the existing tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          node tools/release/release-artifacts.mjs tag
      - name: Publish the tested npm tarball through OIDC
        if: steps.npm.outputs.status == 'missing'
        env:
          NPM_TARBALL: ${{ steps.npm.outputs.filename }}
        run: npm publish "artifacts/npm/${NPM_TARBALL}" --access public --tag latest --registry=https://registry.npmjs.org/ --ignore-scripts
      - name: Confirm npm publication integrity
        run: node tools/release/npm-release.mjs --require-published
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: NuGet login through Trusted Publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish NuGet package and symbols
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/package/CStructSharp.${VERSION}.nupkg" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/package/CStructSharp.${VERSION}.snupkg" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Create or complete GitHub Release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "CStructSharp ${VERSION}" --generate-notes
          fi
          gh release upload "${TAG}" artifacts/package/*.nupkg artifacts/package/*.snupkg "artifacts/cstructsharp-wasm-v${VERSION}.zip" "artifacts/npm/cstructsharp-${VERSION}.tgz" artifacts/release-manifest.json --clobber
