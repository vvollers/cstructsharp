name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Node.js for documentation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: CStructSharp.Docs/package-lock.json

      - name: Calculate and apply version bump
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const bump = process.env.BUMP;
          const projectPath = 'CStructSharp/CStructSharp.csproj';
          const project = fs.readFileSync(projectPath, 'utf8');
          const current = project.match(/<VersionPrefix>(\d+)\.(\d+)\.(\d+)<\/VersionPrefix>/);
          if (!current) throw new Error('VersionPrefix was not found.');
          const parts = current.slice(1).map(Number);
          const index = { major: 0, minor: 1, patch: 2 }[bump];
          if (index === undefined) throw new Error(`Unsupported bump: ${bump}`);
          parts[index] += 1;
          for (let i = index + 1; i < parts.length; i += 1) parts[i] = 0;
          const version = parts.join('.');
          const updatedProject = project
            .replace(/<VersionPrefix>[^<]+<\/VersionPrefix>/, `<VersionPrefix>${version}</VersionPrefix>`)
            .replace(/\s*<VersionSuffix>[^<]+<\/VersionSuffix>/, '');
          fs.writeFileSync(projectPath, updatedProject);
          const packagePath = 'CStructSharpWeb/package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          packageJson.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          const lockPath = 'CStructSharpWeb/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          if (lock.packages?.['']) lock.packages[''].version = version;
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=v${version}\n`);
          NODE

      - name: Commit and tag version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CStructSharp/CStructSharp.csproj CStructSharpWeb/package.json CStructSharpWeb/package-lock.json
          git commit -m "chore: release ${VERSION}"
          git push origin HEAD:main
          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "${TAG}"

      - name: Install documentation dependencies
        working-directory: CStructSharp.Docs
        run: npm ci --ignore-scripts

      - name: Build documentation
        shell: pwsh
        run: ./tools/Build-Documentation.ps1

      - name: Install WebAssembly workload
        run: dotnet workload restore ./CStructSharpWeb/wasm/CStructSharpWeb.Wasm.csproj

      - name: Install explorer dependencies
        working-directory: CStructSharpWeb
        run: npm ci

      - name: Pack NuGet package for all target frameworks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack ./CStructSharp/CStructSharp.csproj -c Release -o ./artifacts/package -p:Version=${VERSION}

      - name: Build WebAssembly explorer
        working-directory: CStructSharpWeb
        run: npm run build

      - name: Assemble GitHub Pages site
        run: |
          rm -rf artifacts/pages
          mkdir -p artifacts/pages/docs artifacts/pages/explorer
          cp -R CStructSharp.Docs/_site/. artifacts/pages/docs/
          cp -R CStructSharpWeb/dist/. artifacts/pages/explorer/
          cp CStructSharp.Docs/landing/index.html artifacts/pages/index.html
          touch artifacts/pages/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Create standalone WASM bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: zip -r "artifacts/cstructsharp-wasm-v${VERSION}.zip" CStructSharpWeb/dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            artifacts/package/*.nupkg \
            artifacts/package/*.snupkg \
            "artifacts/cstructsharp-wasm-v${VERSION}.zip" \
            --title "CStructSharp ${VERSION}" \
            --generate-notes