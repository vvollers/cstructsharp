version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
      - /benchmarks/*
      - /docs/examples
      - /docs/examples/starter
    # The generator targets Roslyn 4.8 (Visual Studio 17.8, .NET SDK 8) as its floor, and its tests host it there;
    # a newer Microsoft.CodeAnalysis would stop it loading in those hosts, so it is raised only on purpose.
    ignore:
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
    schedule:
      interval: weekly
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    # The repository workspace: the apps, their shared source and the npm package, one lockfile.
    directory: /
    # Keep the supported TypeScript 6 toolchain; ignore every TypeScript 7 release.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The documentation checks (markdownlint, cspell, Playwright): one grouped pull request, like the other lockfiles.
  - package-ecosystem: npm
    directory: /docs
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
    schedule:
      interval: weekly
    groups:
      documentation-dependencies:
        patterns:
          - "*"

  # The JavaScript benchmark harness (tinybench, Playwright).
  - package-ecosystem: npm
    directory: /benchmarks/js
    schedule:
      interval: weekly
    groups:
      benchmark-dependencies:
        patterns:
          - "*"
