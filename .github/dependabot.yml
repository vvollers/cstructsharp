version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
      - /benchmarks/*
      - /docs/examples
      - /docs/examples/starter
    schedule:
      interval: weekly
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/workshop
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/inspector
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
