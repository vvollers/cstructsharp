version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
      - /benchmarks/*
      - /docs/examples
      - /docs/examples/starter
    schedule:
      interval: weekly
    groups:
      dotnet-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    # The apps workspace: explorer, inspector and their shared source, one lockfile.
    directory: /apps
    # Keep the supported TypeScript 6 toolchain; ignore every TypeScript 7 release.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /docs
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /benchmarks/js
    schedule:
      interval: weekly
